name: Daily News Update

on:
  schedule:
    # 매일 22:00 UTC = 07:00 KST
    - cron: "0 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run collection + classification + AI pipeline
        run: npm run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push updated data/logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json logs/

          if git diff --staged --quiet; then
            echo "변경 사항 없음, 커밋 생략"
            exit 0
          fi

          COMMIT_MSG="chore: daily news update $(date -u +%Y-%m-%d)"
          git commit -m "$COMMIT_MSG"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi

            echo "push 거부됨 (시도 $attempt/5) — data/news.json·logs/는 매번 새로 생성되는 " \
                 "파일이라 병합 대신 최신 실행 결과로 덮어써서 재시도합니다"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --soft "origin/$GITHUB_REF_NAME"
            git add data/news.json logs/
            git commit -m "$COMMIT_MSG"
            sleep $((attempt * 5))
          done

          echo "여러 번 재시도했지만 push에 실패했습니다"
          exit 1

      - name: Build frontend
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
